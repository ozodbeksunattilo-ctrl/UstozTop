services:
  db:
    image: postgres:16-alpine
    container_name: ustoztop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ustoztop
      POSTGRES_PASSWORD: ustoztop
      POSTGRES_DB: ustoztop
    ports:
      - "5433:5432"
    volumes:
      - ustoztop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustoztop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ustoztop-pgdata:
